aptitudes:
  description: The aptitudes (skills) possessed by this Profile
  type: list[dict]
  nullable: false
  is_pk: false
  is_fk: false
  nested_structures:
    id:
      description: A unique internal identifier for the aptitude.
      type: str
      nullable: false
      is_pk: false
      is_fk: true
    cumulativeExperience:
      description: A score representing the practical use of this skill in past work experiences, training programs, certifications, and related activities. Displays in the XPS field in the UI.
      type: int
      nullable: true
      is_pk: false
      is_fk: false
    visibility:
      description: A definition of the visibility status of the aptitude on the profile, such as whether it is highlighted (favorite), regularly visible, or hidden. Corresponds to the Visibility and Highlighted options in the UI.
      type: str
      nullable: false
      is_pk: false
      is_fk: false
    profileId:
      description: The internal ID of the profile associated with this aptitude.
      type: str
      nullable: false
      is_pk: false
      is_fk: true
      notes:
        - reference the id from the beggining.
    conceptId:
      description: The internal ID of the referenced concept, globally unique.
      type: str
      nullable: false
      is_pk: false
      is_fk: false
    name:
      description: The name of the referenced skill.
      type: str
      nullable: false
      is_pk: false
      is_fk: false
    proficiency:
      description: The expected proficiency of the skill, generally out of 0-5.
      type: int
      nullable: false
      is_pk: false
      is_fk: false
    type:
      description: The type of the referenced skill.
      type: str
      nullable: false
      is_pk: false
      is_fk: false
  quality:
    null_percen: 0
    unique_percen: 0
    referential_integrity: Should be granted.
educations:
  description: A list of educational achievements, such as degrees, certifications, or training programs associated with the profile.
  type: list[dict]
  nullable: false
  is_pk: false
  is_fk: false
  nested_structures:
    aptitudesReferences:
      description: The skills (aptitudes) that were used in this education
      type: list[dict]
      nullable: true
      is_pk: false
      is_fk: false
      nested_structures:
        aptitudeId:
          description: The internal ID of the referenced aptitude.
          type: str
          nullable: false
          is_pk: false
          is_fk: true
        conceptId:
          description: The UUID of the referenced concept in the ontology (skill). When used in input if there is no aptitudeId, Whoz will determine which aptitude has this concept. If none, a new aptitude will be added to the profile.
          type: str
          nullable: false
          is_pk: false
          is_fk: false
        name:
          description: The name of the referenced aptitude. When used in input if there is nor aptitudeId nor conceptId, Whoz will determine which aptitude has this name. If none, a new aptitude will be added to the profile.
          type: str
          nullable: false
          is_pk: false
          is_fk: false
        type:
          description: The type of the referenced aptitude.
          type: str
          nullable: false
          is_pk: false
          is_fk: false
    degree:
      description:
      type: str
      nullable: false
      is_pk: false
      is_fk: false
    description:
      description:
      type: str
      nullable: false
      is_pk: false
      is_fk: false
    address:
      description:
      type: str
      nullable: false
      is_pk: false
      is_fk: false
      nested_structures:
  quality:
    null_percen: 0
    unique_percen: 0
    referential_integrity: Should be granted.
