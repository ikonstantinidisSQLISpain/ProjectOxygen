  type: date
  nullable: false
  is_pk: false
  is_fk: false
  quality:
    null_percen: 0
    unique_percen: 0.899
    date_format:
      template: "%Y-%m-%dT%H:%M:%S.%fZ"
      mapping:
        year: "%Y"
        month: "%m"
        day: "%d"
        hour: "%H"
        minute: "%M"
        seconds: "%S"
        microseconds: "%f"
        timezone: "Z"
