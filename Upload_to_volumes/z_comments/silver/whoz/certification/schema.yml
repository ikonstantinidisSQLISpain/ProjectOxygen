id:
  description: The internal ID of the domain object, stability in time not guaranteed
  type: str
  nullable: false
  is_pk: true
  is_fk: false
  quality:
    null_percen: 0
    unique_percen: 1
profileId:
  description: Internal identifier of the profile linked to this certification.
  type: str
  nullable: false
  is_pk: false
  is_fk: true
  quality:
    null_percen: 0
    unique_percen: 0.328
    referential_integrity: Should be granted.
aiOnly:
  description:
  type: bool
  nullable: false
  is_pk: false
  is_fk: false
  quality:
    null_percen: 0
    unique_percen: 0
    notes:
      - All false.
      - Not provided in the API.
aptitudeReferences:
  description: List of aptitudes (skills) validated or certified by this certification.
  type: list[dict]
  nullable: false
  is_pk: false
  is_fk: false
  nested_structures:
    aptitudeId:
      description: The internal ID of the referenced aptitude.
      type: str
      nullable: false
      is_pk: false
      is_fk: true
      note: Does not need to reference a skill in the database.
    conceptId:
      description: The UUID of the referenced concept in the ontology (skill). When used in input if there is no aptitudeId, Whoz will determine which aptitude has this concept. If none, a new aptitude will be added to the profile.
      type: str
      nullable: false
      is_pk: false
      is_fk: true
    name:
      description: The name of the referenced aptitude. When used in input if there is nor aptitudeId nor conceptId, Whoz will determine which aptitude has this name. If none, a new aptitude will be added to the profile.
      type: str
      nullable: false
      is_pk: false
      is_fk: false
    type:
      description: The type of the referenced aptitude.
      type: str
      nullable: false
      is_pk: false
      is_fk: false
  quality:
    null_percen: 0
    unique_percen: 1
    referential_integrity: Should be granted, not confirmed.
