resources:
  pipelines:
    app:
      name: app
      configuration:
        read.catalog: ${var.catalog}
        raw.schema: "landing"
        bronze.schema: "bronze_app"
        silver.schema: "silver_app"
        mapping.schema: "bronze_mapping"
      libraries:
        - glob:
            include: "../src/flow/pipelines/app/**"
      serverless: true
      catalog: ${var.catalog}
      schema: bronze_app