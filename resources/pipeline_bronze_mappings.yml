        read.catalog: ${var.catalog}
        read.schema: "landing"
        target.schema: "bronze_mapping"
      libraries:
        - glob:
            include: "../src/flow/pipelines/bronze_mappings/**"
      serverless: true
      catalog: ${var.catalog}
      schema: bronze_mapping