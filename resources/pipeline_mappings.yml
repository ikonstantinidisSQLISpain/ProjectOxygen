resources:
  pipelines:
    mapping:
      name: mapping
      configuration:
        read.catalog: ${var.catalog}
        raw.schema: "landing"
        bronze.schema: "bronze_mapping"
      libraries:
        - glob:
            include: "../src/flow/pipelines/mappings/bronze/**"
      serverless: true
      catalog: ${var.catalog}
      schema: bronze_mapping