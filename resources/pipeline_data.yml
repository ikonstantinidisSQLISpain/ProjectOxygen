resources:
  pipelines:
    data:
      name: data
      configuration:
        read.catalog: ${var.catalog}
        raw.schema: "landing"
        bronze.schema: "bronze_data"
      libraries:
        - glob:
            include: "../src/flow/pipelines/data/bronze/**"
      serverless: true
      catalog: ${var.catalog}
      schema: bronze_data