[project]
name = "whoz_ingestion"
version = "0.0.1"
authors = [{ name = "ikonstantinidis@sqli.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # Plain open-source PySpark, not databricks-connect: the two can't be installed
    # together, and Spark 4.0 open-sourced the VARIANT type / try_variant_get /
    # variant_explode that utilities/*.py needs, so a local session is enough to
    # unit test it. Needs a local JDK 17+ on PATH (see README.md#testing).
    "pyspark>=4.0,<5",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
# Lakeflow injects `spark` into every transformation module's namespace at runtime;
# there is no import that would satisfy F821. Declaring it here lets ruff check the
# rest of those files instead of drowning the report in 19 false positives.
builtins = ["spark"]

[tool.pytest.ini_options]
# Deliberately src/whoz_ingestion_etl and NOT src. The pipeline's root_path IS
# src/whoz_ingestion_etl (resources/whoz_ingestion_etl.pipeline.yml), so at runtime
# that folder is on sys.path and modules are imported as `utilities.x` — never
# `whoz_ingestion_etl.utilities.x`. Pointing pytest at the same folder means tests
# import by the exact path production uses, so a wrong prefix fails locally and in CI
# rather than surviving to a deploy (which is how it was found the first time).
pythonpath = ["src/whoz_ingestion_etl"]
