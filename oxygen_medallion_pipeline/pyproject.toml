[project]
name = "whoz_ingestion"
version = "0.0.1"
authors = [{ name = "ikonstantinidis@sqli.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    # Plain open-source PySpark, not databricks-connect: the two can't be installed
    # together, and Spark 4.0 open-sourced the VARIANT type / try_variant_get /
    # variant_explode that utilities/*.py needs, so a local session is enough to
    # unit test it. Needs a local JDK 17+ on PATH (see README.md#testing).
    "pyspark>=4.0,<5",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# src/whoz_ingestion_etl is deployed straight onto the pipeline's path by Lakeflow
# (via resources/whoz_ingestion_etl.pipeline.yml's root_path/libraries.glob), not
# installed as a package. This makes it importable for tests too.
pythonpath = ["src"]
