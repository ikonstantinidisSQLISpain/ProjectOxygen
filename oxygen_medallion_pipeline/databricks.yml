# This is the Databricks asset bundle for Project Oxygen's medallion pipelines.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
#
# One bundle, multiple pipelines: each source gets its own resources/*.pipeline.yml
# + resources/*.job.yml (picked up automatically by the include glob below) and its
# own src/<source>_etl/ folder, sharing these targets/variables/permissions. Today
# that's just Whoz (resources/whoz_ingestion_etl.pipeline.yml); more sources land the
# same way, not as separate bundles.
bundle:
  name: oxygen_medallion_pipeline
  # Stable identity for this bundle's deploy state — do not regenerate on rename.
  uuid: 46e5b176-ed17-4115-8ec5-9b7b0fd69053

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the targets below. Catalog is
# the environment/isolation boundary (one per target); bronze_schema/silver_schema are
# literal "bronze"/"silver" in every target — see the four targets below.
variables:
  catalog:
    description: The catalog to use
  bronze_schema:
    description: Schema for bronze (raw) tables — always "bronze"
  silver_schema:
    description: Schema for silver (cleaned/conformed) tables — always "silver"

targets:
  local:
    # What a bare `databricks bundle deploy` hits — one personal, fully isolated
    # catalog per developer, never touched by CI. Requires oxygen_dev_<you> to
    # already exist; see README.md for the one-time `databricks catalogs create`
    # step. 'mode: development':
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405610661645830.10.azuredatabricks.net
    variables:
      catalog: oxygen_dev_${workspace.current_user.short_name}
      bronze_schema: bronze
      silver_schema: silver
  dev:
    # Shared, CI-deployed environment (resources/whoz_ingestion_etl.pipeline.yml
    # deploys here on push to the 'dev' branch — see .github/workflows/databricks-cd.yml).
    # Not the default target: a bare local deploy must not be able to touch this by
    # accident. Still 'mode: development' (paused schedules, [dev ...]-prefixed
    # resource names) — deliberately kept simple rather than treated as a real
    # always-on environment.
    mode: development
    workspace:
      host: https://adb-7405610661645830.10.azuredatabricks.net
    variables:
      catalog: oxygen_dev
      bronze_schema: bronze
      silver_schema: silver
  test:
    # Same shape as dev, one tier up — deploys on push to the 'test' branch.
    mode: development
    workspace:
      host: https://adb-7405610661645830.10.azuredatabricks.net
    variables:
      catalog: oxygen_test
      bronze_schema: bronze
      silver_schema: silver
  prod:
    mode: production
    workspace:
      host: https://adb-7405610661645830.10.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ikonstantinidis@sqli.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ikonstantinidis@sqli.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Its own catalog, not shared with dev/test — real access-control separation
      # is the point here (bronze holds raw payloads that aren't fully anonymized,
      # see docs/whoz_profile_data_model.md).
      catalog: oxygen_prod
      bronze_schema: bronze
      silver_schema: silver
    permissions:
      - user_name: ikonstantinidis@sqli.com
        level: CAN_MANAGE
      # sp-oxygen-cicd: deploys this target from .github/workflows/databricks-cd.yml
      - service_principal_name: 80c15587-d8a7-4f9f-bb71-5aff5c5104e4
        level: CAN_MANAGE
