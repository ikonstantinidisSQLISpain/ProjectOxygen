# This is the Databricks asset bundle for Project Oxygen's medallion pipelines.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
#
# One bundle, multiple pipelines: each source gets its own resources/*.pipeline.yml
# + resources/*.job.yml (picked up automatically by the include glob below) and its
# own src/<source>_etl/ folder, sharing these targets/variables/permissions. Today
# that's just Whoz (resources/whoz_ingestion_etl.pipeline.yml); more sources land the
# same way, not as separate bundles.
bundle:
  name: oxygen_medallion_pipeline
  # Stable identity for this bundle's deploy state — do not regenerate on rename.
  uuid: 46e5b176-ed17-4115-8ec5-9b7b0fd69053

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405610661645830.10.azuredatabricks.net
    variables:
      catalog: oxygen_dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405610661645830.10.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ikonstantinidis@sqli.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ikonstantinidis@sqli.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: oxygen_dev
      schema: prod
    permissions:
      - user_name: ikonstantinidis@sqli.com
        level: CAN_MANAGE
      # sp-oxygen-cicd: deploys this target from .github/workflows/databricks-cd.yml
      - service_principal_name: 80c15587-d8a7-4f9f-bb71-5aff5c5104e4
        level: CAN_MANAGE
