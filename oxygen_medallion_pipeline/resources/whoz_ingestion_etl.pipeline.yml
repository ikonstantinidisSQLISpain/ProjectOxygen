# The main pipeline for whoz_ingestion

resources:
  pipelines:
    whoz_ingestion_etl:
      name: whoz_ingestion_etl
      catalog: ${var.catalog}
      # Fallback only — every table gets its own explicit bronze./silver.-qualified
      # name in the Python source (see transformations/silver/whoz_profile.py etc), so this rarely
      # actually applies to anything.
      schema: ${var.bronze_schema}
      serverless: true
      # src/, not src/whoz_ingestion_etl/: root_path is what Lakeflow puts on sys.path,
      # and the shaping/expectations code the transformations import lives in the sibling
      # src/whoz_ingestion/ package (shared with the test suite). Pointing one level up
      # makes `import whoz_ingestion.shaping.profile` resolve here by exactly the same
      # path pytest uses (pyproject.toml's pythonpath), which is the property worth
      # protecting — an import that works in one and not the other is a deploy-time
      # failure found the hard way. Only the glob below is loaded as pipeline source;
      # nothing else under src/ is executed just for being on the path.
      root_path: "../src"

      libraries:
        - glob:
            include: ../src/whoz_ingestion_etl/transformations/**

      # Read by the transformation files through spark.conf.get, so these can change
      # without touching the Python source. Every table's name is schema-qualified
      # with catalog/bronze_schema/silver_schema explicitly (see each file) rather
      # than relying on the catalog/schema defaults above, since those two need to
      # diverge in prod (see databricks.yml) — bronze and silver must land in
      # different schemas there, not the pipeline's single default.
      configuration:
        # Landing location of the Whoz export. 'source' is a shared landing volume
        # (not Whoz-specific) — bronze filters to just Whoz's files via a filename
        # glob, see FILE_NAME_GLOB.
        whoz.profiles.source_path: /Volumes/oxygen_dev/landing/source/
        whoz.profiles.schema_path: /Volumes/oxygen_dev/landing/source/_checkpoints/whoz_profiles_schema
        # Talent export. Same shared landing volume, different filename glob (see
        # FILE_NAME_GLOB in transformations/bronze/whoz_talents.py), so the two Auto Loader streams don't
        # see each other's files. Its own schemaLocation — two streams must never share a
        # checkpoint directory.
        #
        # KNOWN OPEN BUG, all four paths above and below: the volume is hardcoded to
        # oxygen_dev instead of being ${var.catalog}-qualified, so a test or prod deploy
        # reads *dev's* landing volume. Only dev has been run against real files, which is
        # why it hasn't bitten yet. Fix all four together — a half-fix is worse, since the
        # two entities would then disagree about which environment they are in.
        whoz.talents.source_path: /Volumes/oxygen_dev/landing/source/
        whoz.talents.schema_path: /Volumes/oxygen_dev/landing/source/_checkpoints/whoz_talents_schema
        whoz.catalog: ${var.catalog}
        whoz.bronze_schema: ${var.bronze_schema}
        whoz.silver_schema: ${var.silver_schema}

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
