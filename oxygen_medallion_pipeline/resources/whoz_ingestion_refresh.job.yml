# Scheduled refresh of the Whoz profile ingestion pipeline.

resources:
  jobs:
    whoz_ingestion_refresh:
      name: whoz_ingestion_refresh

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      # No job parameters: the sole task below triggers whoz_ingestion_etl by pipeline
      # ID, which already carries its own catalog/schema config from databricks.yml —
      # nothing here consumes job-level parameters.
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.whoz_ingestion_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
